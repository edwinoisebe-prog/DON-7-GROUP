<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>don7group - DON 7 GROUP We Serve with Pride</title>
<meta name="description" content="don7group - DON 7 GROUP Electronics & Repair">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:linear-gradient(135deg,#0a1930,#1e3a8a,#3b82f6);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.card{background:rgba(255,255,255,0.08);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.2);border-radius:20px;padding:30px;width:100%;max-width:380px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,0.3)}
.logo-wrap{width:110px;height:110px;background:white;border-radius:50%;margin:0 auto 15px;display:flex;align-items:center;justify-content:center;border:3px solid #f59e0b;overflow:hidden}
.logo-wrap img{width:100%;height:100%;object-fit:contain}
h1{font-size:28px;margin-bottom:5px}.don{color:#60a5fa}.seven{color:#f87171}.group{color:white}
.sub{color:#fbbf24;font-size:15px;font-weight:bold}.motto{color:rgba(255,255,255,0.8);font-size:13px;font-style:italic;margin:8px 0 20px}
input{width:100%;padding:13px 15px;margin:8px 0;border-radius:10px;border:1px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.1);color:white;outline:none}
input::placeholder{color:rgba(255,255,255,0.6)}
button{width:100%;padding:13px;background:#fbbf24;color:#0a1930;border:none;border-radius:10px;font-weight:bold;font-size:16px;margin-top:12px;cursor:pointer}
button:hover{background:#f59e0b}
.footer{margin-top:18px;color:white;font-size:13px;line-height:1.6}
#dashboard{display:none;color:white;text-align:left}
#dashboard h2{color:#fbbf24;text-align:center;margin-bottom:15px}
.item{background:rgba(255,255,255,0.1);padding:12px;border-radius:10px;margin:8px 0}
.logout{background:rgba(255,255,255,0.2);color:white;margin-top:20px}
#error{color:#f87171;font-size:13px;margin-top:10px;display:none}
</style>
</head>
<body>

<div class="card" id="loginBox">
<div class="logo-wrap">
<img src="logo.png" alt="DON 7 GROUP">
</div>
<h1><span class="don">DON</span> <span class="seven">7</span> <span class="group">GROUP</span></h1>
<div class="sub">Electronics & Repair</div>
<div class="motto">We Serve with Pride</div>
<input type="text" id="username" placeholder="Username">
<input type="password" id="password" placeholder="Password">
<div id="error">Wrong username or password!</div>
<button onclick="doLogin()">Login</button>
<div class="footer">📞 0723398997<br>© don7group</div>
</div>

<div class="card" id="dashboard">
<h2>Welcome don7group ✅</h2>
<p style="text-align:center;margin-bottom:15px">We Serve with Pride 🔥</p>
<div class="item">📱 Phone Repair</div>
<div class="item">💻 Laptop & Electronics</div>
<div class="item">🔌 Accessories & Sales</div>
<div class="item">📞 Contact: 0723398997</div>
<div class="item">📍 don7group - DON 7 GROUP</div>
<button class="logout" onclick="doLogout()">Logout</button>
</div>

<script>
function doLogin(){
let u=document.getElementById('username').value.trim();
let p=document.getElementById('password').value.trim();
if(u==="don7group" && p==="Don7group"){
document.getElementById('loginBox').style.display='none';
document.getElementById('dashboard').style.display='block';
document.getElementById('error').style.display='none';
}else{
document.getElementById('error').style.display='block';
}
}
function doLogout(){
document.getElementById('dashboard').style.display='none';
document.getElementById('loginBox').style.display='block';
document.getElementById('username').value='';
document.getElementById('password').value='';
}
</script>
</body>
</html>
