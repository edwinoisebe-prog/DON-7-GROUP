<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>don7group - DON 7 GROUP We Serve with Pride</title>
<meta name="description" content="don7group - DON 7 GROUP Electronics & Repair - 0723398997">
<link rel="icon" href="logo.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a1122;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.card{background:#1e1e1e;border-radius:18px;padding:35px 25px;width:100%;max-width:380px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
h1{color:white;font-size:30px;font-weight:900;letter-spacing:1px;margin-bottom:18px}
.sub{color:rgba(255,255,255,0.9);font-size:18px;margin-bottom:12px}
.motto{color:rgba(255,255,255,0.9);font-size:18px;margin-bottom:28px}
input{width:100%;padding:14px 15px;background:#2d2d2d;border:1px solid #3a3a3a;border-radius:10px;color:white;font-size:15px;outline:none;margin-bottom:14px}
input::placeholder{color:rgba(255,255,255,0.6)}
.btn-admin{width:100%;padding:14px;background:#1e365e;color:white;border:none;border-radius:10px;font-weight:800;font-size:15px;cursor:pointer;margin-bottom:14px;letter-spacing:0.5px}
.btn-admin:hover{background:#24467a}
.btn-customer{width:100%;padding:14px;background:#0a8a1a;color:white;border:none;border-radius:10px;font-weight:800;font-size:15px;cursor:pointer;letter-spacing:0.5px}
.btn-customer:hover{background:#0ca320}
.footer{color:rgba(255,255,255,0.6);font-size:13px;margin-top:18px}
#error{color:#ff7b7b;font-size:13px;margin-bottom:10px;display:none;background:rgba(255,0,0,0.1);padding:8px;border-radius:8px}
#shop{display:none;text-align:left;color:white}
#shop h2{color:#22c55e;text-align:center;margin-bottom:15px}
.item{background:#2d2d2d;padding:12px;border-radius:10px;margin:8px 0;border-left:4px solid #22c55e}
</style>
</head>
<body>

<div class="card" id="loginBox">
<h1>DON 7 GROUP</h1>
<div class="sub">Electronics & Repair</div>
<div class="motto">We Serve with Pride</div>
<input type="password" id="password" placeholder="Password: 0723398997">
<div id="error">Wrong password!</div>
<button class="btn-admin" onclick="loginAdmin()">LOGIN AS ADMIN</button>
<button class="btn-customer" onclick="viewShop()">I AM CUSTOMER - VIEW SHOP</button>
<div class="footer">Admin: 0723398997</div>
</div>

<div class="card" id="shop">
<h2>DON 7 GROUP Shop 🛒</h2>
<p style="text-align:center;margin-bottom:15px;color:rgba(255,255,255,0.8)">We Serve with Pride</p>
<div class="item">📱 Professional Phone Repair</div>
<div class="item">💻 Laptop & Electronics Sales</div>
<div class="item">🔌 Accessories - Chargers, Cables</div>
<div class="item">⚡ M-Pesa & Airtime</div>
<div class="item">📞 Contact: 0723398997</div>
<div class="item">📍 Google: don7group</div>
<button class="btn-admin" onclick="backToLogin()" style="margin-top:20px">Back to Login</button>
</div>

<script>
function loginAdmin(){
  const p=document.getElementById('password').value.trim();
  if(p==="0723398997" || p==="Don7group" || p==="don7group"){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('shop').style.display='block';
    document.getElementById('error').style.display='none';
  }else{
    document.getElementById('error').style.display='block';
  }
}
function viewShop(){
  document.getElementById('loginBox').style.display='none';
  document.getElementById('shop').style.display='block';
}
function backToLogin(){
  document.getElementById('shop').style.display='none';
  document.getElementById('loginBox').style.display='block';
  document.getElementById('password').value='';
  document.getElementById('error').style.display='none';
}
document.getElementById('password').addEventListener('keypress',function(e){if(e.key==='Enter'){loginAdmin()}});
</script>
</body>
</html>
